name: Android CI

on:
  push:
    branches: [fix/v1-feedback]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test and build phone debug APK
        run: .\gradlew.bat testDebugUnitTest assembleDebug -PGUIAMED_API_BASE_URL=http://127.0.0.1:8000/ --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: guiamed-v1-phone-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
